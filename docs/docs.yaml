# yaml-language-server: $schema=docs.schema.json

functions:
  - title: '{{ .<variable name> }}'
    description: >-
      Take key-value pairs from the CLI and replace them inside the
      template
    template: >-
      {{ .foo }}
    vars:
      foo: bar

  - title: '{{ extractMarkdownContent <source> }}'
    description: >-
      Return the Markdown body without frontmatter. Missing frontmatter is
      valid and returns the original Markdown. Invalid frontmatter returns
      an error.
    preCommands:
      - "echo -e '---\\ntitle: Example\\n---\\n# Heading' > page.md"
    template: '{{ extractMarkdownContent (file "page.md") }}'

  - title: '{{ extractMarkdownFrontmatter <source> }}'
    description: >-
      Extract frontmatter as a map. Missing frontmatter is valid and returns
      an empty map. Invalid frontmatter returns an error.
    preCommands:
      - "echo -e '---\\ntitle: Example\\n---\\n# Heading' > page.md"
    template: >-
      {{ index (extractMarkdownFrontmatter (file "page.md")) "title" }}

  - title: '{{ file <file name> }}'
    description: >-
      Read a file and place it inside the template. Returns an empty string
      on error.
    preCommands:
      - echo "Hello World" > hello
    template: '{{ file "hello" }}'

  - title: '{{ fromYaml <source> }}'
    description: Parse YAML into a template value.
    template: '{{ index (fromYaml "answer: 42") "answer" }}'

  - title: '{{ markdown <source> }}'
    description: Format the source using a Markdown parser.
    template: '{{ markdown "# headline" }}'

  - title: '{{ mustFile <file name> }}'
    description: >-
      Read a file and place it inside the template. Returns an error when the
      file cannot be read.
    preCommands:
      - echo "Hello World" > hello
    template: '{{ mustFile "hello" }}'

  - title: '{{ mustVault <path> <key> }}'
    description: >-
      Read a key from Vault at `VAULT_ADDR`. Authenticate with `VAULT_TOKEN`,
      `VAULT_ROLE_ID` with optional `VAULT_SECRET_ID`, or a `~/.vault-token`
      file. Returns an error when the value cannot be read.
    output: bar
    preCommands:
      - vault write secret/test foo=bar
    template: '{{ mustVault "secret/test" "foo" }}'

  - title: '{{ toYaml <value> }}'
    description: Serialize a value as YAML with two-space indentation.
    template: '{{ toYaml (dict "answer" 42) }}'

  - title: '{{ tplexec (file "my.tpl") }}'
    description: >-
      Execute the given template with the same function set and variables as
      the parent template.
    environ:
      FOO: bar
    preCommands:
      - "echo '{{ env \"FOO\" }}' >my.tpl"
    template: '{{ tplexec (file "my.tpl") }}'

  - title: '{{ urlescape <input string> }}'
    description: Escape input for use inside a URL query parameter.
    template: '{{ urlescape "Hellö Wörld@Golang" }}'

  - title: '{{ vault <path> <key> }}'
    description: >-
      Read a key from Vault at `VAULT_ADDR`. Authenticate with `VAULT_TOKEN`,
      `VAULT_ROLE_ID` with optional `VAULT_SECRET_ID`, or a `~/.vault-token`
      file. Returns an empty string on error.
    output: bar
    preCommands:
      - vault write secret/test foo=bar
    template: '{{ vault "secret/test" "foo" }}'

